version: 0.2.0.dev0
name: mini_fx
description: Tiny toy price-volume-FX dataset (datasets.mini.fx). Defined in-memory,
  not file-backed.
datasets:
- name: fx
  source: datasets.mini.fx
  description: Products sold in countries over two years
  fields:
  - name: product
    expression:
      sql: product
    description: Product
    datatype: String
  - name: country
    expression:
      sql: country
    description: Country
    datatype: String
  - name: year
    expression:
      sql: year
    description: Calendar year
    datatype: Integer
  - name: volume
    expression:
      sql: volume
    description: Units sold
    datatype: Integer
  - name: price_in_lc
    expression:
      sql: price_in_lc
    description: Price in local currency
    datatype: Float
  - name: fx_rate
    expression:
      sql: fx_rate
    description: FX rate to reporting currency
    datatype: Float
  - name: price
    expression:
      sql: price
    description: price_in_lc * fx_rate
    datatype: Float
  - name: revenue
    expression:
      sql: revenue
    description: price * volume
    datatype: Float
  metrics:
  - name: total_volume
    expression:
      sql: SUM(volume)
    description: Total units sold
    datatype: Integer
    custom_extensions:
    - vendor_name: PVM
      data: |
        version: 1
        role: quantity
  - name: avg_price_in_lc
    expression:
      sql: SUM(volume * price_in_lc) / SUM(volume)
    description: Volume-weighted average price in local currency
    datatype: Float
    custom_extensions:
    - vendor_name: PVM
      data: |
        version: 1
        role: rate
  - name: avg_fx_rate
    expression:
      sql: SUM(volume * price) / SUM(volume * price_in_lc)
    description: Volume-weighted average FX rate
    datatype: Float
    custom_extensions:
    - vendor_name: PVM
      data: |
        version: 1
        role: rate
  - name: avg_price
    expression:
      sql: SUM(volume * price) / SUM(volume)
    description: Volume-weighted average price
    datatype: Float
    custom_extensions:
    - vendor_name: PVM
      data: |
        version: 1
        role: rate
  - name: total_revenue
    expression:
      sql: SUM(revenue)
    description: Total revenue
    datatype: Float
relationships: []
metrics: []
custom_extensions:
- vendor_name: PVM
  data: |
    version: 1
    graphs:
      revenue:
        root: total_revenue
        components:
          total_revenue: avg_price * total_volume
          avg_price: avg_price_in_lc + avg_fx_rate
